name: Publish to GitHub Pages

on:
  push:
    branches: [teaser, fix/flat-front-glass-depth]
  pull_request:
    branches: [teaser]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install depth validation dependencies
        run: |
          python3 -m pip install 'Pillow>=10,<14'
          npm install --no-save --no-package-lock playwright
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate committed semantic-region reference depth map
        run: python3 scripts/check_reference_depth.py
      - name: Check JavaScript syntax
        run: |
          node --check dist/scene.js
          node --check dist/parallax.js
          node --check dist/glass-ink.js
          node --check dist/music.mjs
          node --check dist/groove-core.mjs
      - name: Verify committed depth and static build (no model download)
        run: python3 scripts/build.py --check
      - name: Test depth build failures and model cache behavior
        run: python3 scripts/check_build.py
      - name: Validate source, assets, and generated audio
        run: node scripts/check.mjs
      - name: Test tempo controls and audio rescheduling
        run: node scripts/check-ui.mjs
      - name: Start static site for browser depth test
        run: |
          python3 -m http.server 8000 --directory dist > /tmp/teaser-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/teaser-http.log
          exit 1
      - name: Test finger drawing and coupled parallax on the glass
        env:
          TEASER_URL: http://127.0.0.1:8000/
        run: node scripts/check_glass_drawing.mjs
      - name: Measure rendered far, midground, and near parallax
        env:
          TEASER_URL: http://127.0.0.1:8000/
        run: node scripts/check_reference_parallax.mjs
      - name: Upload glass drawing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-drawing-evidence
          path: output/glass_drawing_check/
          if-no-files-found: warn
      - name: Upload depth-plane browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-depth-parallax-evidence
          path: output/reference_parallax_check/
          if-no-files-found: warn
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/teaser')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
