name: Bake corrected foreground glass depth

on:
  push:
    branches: [fix/flat-front-glass-depth]

permissions:
  contents: write

jobs:
  correct-glass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<14'
      - name: Flatten near-plane glass and update metadata
        run: python scripts/flatten_reference_glass.py
      - name: Validate corrected map
        run: |
          python - <<'PY'
          import hashlib, json
          from PIL import Image
          from pathlib import Path
          root=Path('.')
          png=root/'dist/assets/ElGrayPimenovLeiterWindow-depth.png'
          meta=json.loads(png.with_suffix('.json').read_text())
          assert meta['depth_sha256']==hashlib.sha256(png.read_bytes()).hexdigest()
          with Image.open(png) as d:
              assert d.mode=='L' and d.size==(1024,576)
              for y in (0,144,288,431,575):
                  assert all(d.getpixel((x,y))==248 for x in range(662,1024))
          print('Foreground glass plane is flat and the metadata checksum matches.')
          PY
      - name: Commit baked PNG and provenance to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/ElGrayPimenovLeiterWindow-depth.png dist/assets/ElGrayPimenovLeiterWindow-depth.json
          if ! git diff --cached --quiet; then
            git commit -m "Bake corrected front glass depth map"
            git push origin HEAD:fix/flat-front-glass-depth
          fi
