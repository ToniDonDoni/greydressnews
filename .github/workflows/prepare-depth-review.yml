name: Prepare depth review previews

on:
  push:
    branches: [fix/flat-front-glass-depth]
    paths:
      - scripts/prepare_depth_review.py
      - .github/workflows/prepare-depth-review.yml

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<14'
      - run: python scripts/prepare_depth_review.py
      - name: Commit compact review previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f specs/evidence/reference-preview.jpg specs/evidence/current-depth.png
          git commit -m "Add temporary depth review previews"
          git push origin HEAD:fix/flat-front-glass-depth
