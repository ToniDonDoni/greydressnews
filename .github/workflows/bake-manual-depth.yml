name: Bake manual three-plane depth map

on:
  push:
    branches: [fix/flat-front-glass-depth]
    paths:
      - scripts/manual_depth_planes.py
      - scripts/make_reference_depth.py
      - .github/workflows/bake-manual-depth.yml

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<14'
      - name: Apply manual depth planes
        run: python scripts/manual_depth_planes.py
      - name: Validate depth map and evidence
        run: python scripts/manual_depth_planes.py --check
      - name: Commit corrected map and review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f specs/evidence/reference-preview.jpg specs/evidence/current-depth.png
          git add dist/assets/ElGrayPimenovLeiterWindow2-depth.png dist/assets/ElGrayPimenovLeiterWindow2-depth.json specs/evidence/
          if ! git diff --cached --quiet; then
            git commit -m "Bake manually corrected three-plane depth map"
            git push origin HEAD:fix/flat-front-glass-depth
          fi
