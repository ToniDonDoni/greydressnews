<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101419" />
    <meta name="description" content="Layered glass and depth-parallax preview." />
    <title>Layered Glass - Depth Preview</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <figure class="painting" id="painting">
        <img
          id="poster"
          draggable="false"
          src="assets/glass-composite.png"
          alt="Presenter and city behind a rain-covered glass pane."
        />
        <canvas id="depth-view" aria-hidden="true"></canvas>
        <div class="ink-layer" id="ink-layer" aria-hidden="true">
          <canvas id="music-hint" width="1672" height="941"></canvas>
          <canvas id="glass-ink" width="1672" height="941"></canvas>
          <canvas id="glass-ink-live" width="1672" height="941"></canvas>
        </div>
        <div class="loading" id="loading">Preparing the depth view...</div>
      </figure>
      <label class="glass-control" for="glass-alpha">
        <span>Glass alpha</span>
        <input id="glass-alpha" type="range" min="0" max="1" step="0.01" value="0.68" />
        <output id="glass-alpha-value" for="glass-alpha">0.68</output>
      </label>
      <p class="status" id="status" role="status" aria-live="polite" hidden></p>
      <footer>
        <span>WINDOW / DEPTH STUDY</span><span>move to explore / draw on the glass</span>
      </footer>
      <p class="build-line">BUILD <a id="build-commit" href="#">local preview</a></p>
    </main>
    <script src="glass-ink.js"></script>
    <script src="parallax.js"></script>
    <script type="module" src="music.mjs"></script>
    <script src="build-info.js"></script>
  </body>
</html>
