<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101419">
<meta name="description" content="A depth-parallax study exploring a visual dialogue between Yuri Pimenov\u0027s painted city and Saul Leiter\u0027s rain-streaked color and glass.">
<title>Teaser - Depth Parallax</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8C%83%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="art-shell">
  <figure class="painting" id="painting">
    <img id="poster" src="assets/ElGrayPimenovLeiterWindow2.png" alt="A television presenter in a gray dress, with a city building on the left and rain-streaked glass and red lights on the right.">
    <canvas id="depth-view" aria-hidden="true"></canvas>
    <div class="loading" id="loading">Preparing the depth view...</div>
  </figure>
  <div class="soundbar" id="soundbar" role="group" aria-label="Groove playback">
    <button id="music" type="button" aria-label="Play hip-hop" aria-pressed="false" title="Play or pause the instrumental groove">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg>
      <span id="musicLabel">PLAY THE GROOVE</span>
    </button>
    <input id="volume" type="range" min="0" max="100" value="62" aria-label="Music volume" title="Music volume">
  </div>
  </div>
  <footer><span>WINDOW / DEPTH STUDY</span><span class="hint">move the pointer or drag to explore</span></footer>
</main>
<script src="parallax.js"></script>
<script type="module" src="music.mjs"></script>
</body>
</html>
