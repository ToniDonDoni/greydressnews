<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101419">
<meta name="description" content="A depth-parallax study exploring a visual dialogue between Yuri Pimenov's painted city and Saul Leiter's rain-streaked color and glass.">
<title>Teaser - Depth Parallax</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8C%83%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="art-shell">
  <figure class="painting" id="painting">
    <img id="poster" draggable="false" src="assets/ElGrayPimenovLeiterWindow2.png" alt="A television presenter in a gray dress, with a city building on the left and rain-streaked glass and red lights on the right.">
    <canvas id="depth-view" aria-hidden="true"></canvas>
    <div class="ink-layer" id="ink-layer" aria-hidden="true">
      <canvas id="glass-ink" width="1920" height="1077"></canvas>
      <canvas id="glass-ink-live" width="1920" height="1077"></canvas>
    </div>
    <div class="loading" id="loading">Preparing the depth view...</div>
  </figure>
  </div>
  <p class="status" id="status" role="status" aria-live="polite" hidden></p>
  <footer><span>WINDOW / DEPTH STUDY</span><span class="hint">move to explore / draw on the glass</span></footer>
</main>
<script src="glass-ink.js"></script>
<script src="parallax.js"></script>
<script type="module" src="music.mjs"></script>
</body>
</html>
